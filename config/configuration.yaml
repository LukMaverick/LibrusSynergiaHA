# Basic configuration for testing Librus APIX integration

# Bez tego HA startuje w UTC, a szablony uzywajace now() pokazuja
# godziny przesuniete wzgledem zegara uzytkownika.
homeassistant:
  time_zone: Europe/Warsaw

default_config:

# Logger configuration for debugging
logger:
  default: info
  logs:
    custom_components.librus_apix: debug
    librus_apix: debug

# Frontend themes
frontend:
  themes: !include_dir_merge_named themes

# Example automation for grade notifications
automation:
  - alias: "New Grade Notification"
    trigger:
      - platform: state
        entity_id: sensor.librus_latest_grade
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
      - condition: template
        value_template: "{{ trigger.to_state.state != 'No grades' }}"
    action:
      - service: persistent_notification.create
        data:
          title: "Nowa ocena w Librus!"
          message: "{{ trigger.to_state.state }} - {{ trigger.to_state.attributes.date }}"
          notification_id: "new_grade"

  - alias: "New Message Notification"
    trigger:
      - platform: state
        entity_id: sensor.librus_latest_message
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
      - condition: template
        value_template: "{{ trigger.to_state.state != 'No messages' }}"
    action:
      - service: persistent_notification.create
        data:
          title: "Nowa wiadomość w Librus!"
          message: "{{ trigger.to_state.state }}"
          notification_id: "new_message"

# --- Podglad demonstracyjny planu lekcji (bez konta Librusa) ---
# Atrapy sensorow o takich samych nazwach i atrybutach jak encje integracji.
template: !include_dir_merge_list template_config

# Dashboard w trybie YAML + karty Mushroom serwowane z config/www/
lovelace:
  mode: yaml
  resources:
    - url: /local/mushroom.js
      type: module
