<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: librus-terminarz-card</title>
<style>
  :root { --primary-color:#03a9f4; --primary-text-color:#212121; --secondary-text-color:#727272;
    --card-background-color:#fff; --secondary-background-color:#e5e5e5; --divider-color:rgba(0,0,0,.12);
    --text-primary-color:#fff; --error-color:#db4437; --warning-color:#ffa600; --success-color:#43a047;
    --info-color:#4285f4; --disabled-text-color:#9e9e9e; }
  body.ciemny { --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --card-background-color:#1c1c1c;
    --secondary-background-color:#2c2c2c; --divider-color:rgba(255,255,255,.12); background:#111; color:#eee; }
  body { font-family: Roboto, system-ui, sans-serif; margin: 16px; background:#f4f4f4; }
  ha-card { display:block; background:var(--card-background-color); border-radius:12px;
    box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .panel { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:16px; font-size:14px; }
  .panel label { display:flex; gap:4px; align-items:center; }
  #szer { max-width: 560px; }
</style>
</head>
<body>
<div class="panel">
  <label><input type="checkbox" id="ciemny"> ciemny</label>
  <label>widok <select id="widok"><option>agenda</option><option>miesiac</option></select></label>
  <label><input type="checkbox" id="kompakt"> kompakt</label>
  <label><input type="checkbox" id="filtry" checked> filtry</label>
  <label><input type="checkbox" id="nauczyciel"> nauczyciel</label>
  <label>szerokość <select id="w"><option value="560">560</option><option value="360">360</option><option value="768">768</option></select></label>
  <label><input type="checkbox" id="stara"> inna wersja integracji</label>
</div>
<div id="szer"><librus-terminarz-card></librus-terminarz-card></div>
<script type="module">
import "./librus-terminarz-card.js";
const dzis = new Date();
const iso = (n) => { const d = new Date(dzis.getFullYear(), dzis.getMonth(), dzis.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const e = (n, tytul, przedmiot, extra = {}) => ({ data: iso(n), tytul, przedmiot, godzina: "unknown", numer_lekcji: "unknown", szczegoly: {}, href: `${n}|${tytul}`, ...extra });
const zdarzenia = [
  e(0, "Sprawdzian", "Matematyka", { numer_lekcji: 2, szczegoly: { Nauczyciel: "Jan Kowalski", Opis: "Ułamki zwykłe i dziesiętne, działania na ułamkach. Przynieść kalkulator i linijkę." } }),
  e(1, "Kartkówka", "Język polski", { numer_lekcji: 4, szczegoly: { Opis: "Lektura: Pan Tadeusz, księga I" } }),
  e(3, "Wycieczka klasowa do muzeum", "unspecified"),
  e(3, "Sprawdzian z działu 3", "Fizyka", { numer_lekcji: 5 }),
  e(4, "Dzień wolny od zajęć dydaktycznych", "unspecified"),
  e(6, "Lekcja odwołana", "Wychowanie fizyczne", { numer_lekcji: 6 }),
  e(8, "Zebranie z rodzicami", "unspecified", { godzina: "17:30" }),
  e(9, "Konkurs szkolny", "Informatyka", { szczegoly: { Opis: "<script>alert('xss')<\/script> \"><img src=x onerror=alert(1)>" } }),
  e(12, "Test z angielskiego", "Język angielski", { numer_lekcji: 3 }),
  e(16, "Rada pedagogiczna", "unspecified"),
  e(21, "Sprawdzian", "Historia", { numer_lekcji: 1 }),
  e(25, "Ferie zimowe", "unspecified"),
  { ...e(2, "Sprawdzian", "Biologia (stara integracja)"), typ: undefined },
].map((z) => ({ ...z, tydzien: "Monday" }));
const el = document.querySelector("librus-terminarz-card");
function stan(wersja) {
  return { "sensor.terminarz": { state: String(zdarzenia.length), last_updated: String(Math.random()),
    attributes: { zdarzenia, liczba_zdarzen: zdarzenia.length, wersja_integracji: wersja, zakres_do: iso(40) } } };
}
function odswiez() {
  const g = (id) => document.getElementById(id);
  document.body.classList.toggle("ciemny", g("ciemny").checked);
  document.getElementById("szer").style.maxWidth = g("w").value + "px";
  el.setConfig({ type: "custom:librus-terminarz-card", entity: "sensor.terminarz", widok: g("widok").value,
    kompakt: g("kompakt").checked, filtry: g("filtry").checked, pokaz_nauczyciela: g("nauczyciel").checked });
  el.hass = { states: stan(g("stara").checked ? "0.0.1" : "1.2.0") };
}
document.querySelectorAll(".panel input, .panel select").forEach((i) => i.addEventListener("change", odswiez));
odswiez();
</script>
</body>
</html>
